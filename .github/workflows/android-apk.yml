name: Sestavit APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKM" || { echo "sdkmanager not found in $SDKROOT"; exit 1; }
          echo "Používám SDK manager: $SDKM"
          "$SDKM" --sdk_root="$SDKROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Sestavit APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Kvaltik-FIRE-ALERT-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
