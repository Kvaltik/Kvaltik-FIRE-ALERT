name: Sestavit APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Stáhnout kód
        uses: actions/checkout@v4

      - name: Nastavit Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub Ubuntu runner už má Android SDK a sdkmanager.
      # android-actions/setup-android@v3 zde v roce 2026 selhává:
      # "Failed to find package 'tools'", a proto tento krok nepoužíváme.
      - name: Připravit Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Nainstalovat Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Sestavit APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Nahrát APK ke stažení
        uses: actions/upload-artifact@v4
        with:
          name: Kvaltik-FIRE-ALERT-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
