plugins { id 'com.android.application' }

android {
    namespace 'cz.kvaltik.firealert'
    compileSdk 35
    defaultConfig {
        applicationId 'cz.kvaltik.firealert'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }
    signingConfigs {
        release {
            if (System.getenv('FIREALERT_KEYSTORE_FILE')) {
                storeFile file(System.getenv('FIREALERT_KEYSTORE_FILE'))
                storePassword System.getenv('FIREALERT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FIREALERT_KEY_ALIAS')
                keyPassword System.getenv('FIREALERT_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('FIREALERT_KEYSTORE_FILE')) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
